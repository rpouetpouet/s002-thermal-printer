# Services exposés par l'intégration ORGSTA S002.
print_test:
  name: Impression de test
  description: >-
    Imprime un motif de validation (repères de début/fin, 6 bandes distinctes de 1 mm).
    Consomme environ 14 mm de papier.
  fields:
    address:
      name: Adresse
      description: Adresse MAC de l'imprimante (facultatif si une seule est configurée).
      example: "06:03:DD:EC:16:4D"
      selector:
        text:
    dry_run:
      name: Simulation
      description: Ne rien envoyer (calcule seulement les trames).
      default: false
      selector:
        boolean:

print_text:
  name: Impression de texte
  description: Imprime des lignes de texte, une trame d'image après l'autre.
  fields:
    text:
      name: Texte
      description: Une ligne par ligne imprimée. Les lignes vides sont conservées (séparateurs)
        et le texte trop large est replié automatiquement.
      required: true
      example: "Liste de courses\nLait\nPain"
      selector:
        text:
          multiline: true
    scale:
      name: Échelle
      description: Multiplicateur entier de la taille de police (1 à 6).
      default: 3
      selector:
        number:
          min: 1
          max: 6
          mode: box
    margin_dots:
      name: Marge gauche/droite (points)
      description: Marge symétrique en points (16 ≈ 1,35 mm de chaque côté).
      default: 16
      selector:
        number:
          min: 0
          max: 200
          mode: box
          unit_of_measurement: points
    address:
      name: Adresse
      description: Adresse MAC de l'imprimante (facultatif si une seule est configurée).
      selector:
        text:
    dry_run:
      name: Simulation
      default: false
      selector:
        boolean:

feed:
  name: Avance papier
  description: Fait avancer le papier sans rien imprimer (unité ≈ 0,1 mm).
  fields:
    mm:
      name: Millimètres
      description: Longueur d'avance.
      default: 10
      selector:
        number:
          min: 1
          max: 200
          unit_of_measurement: mm
          mode: box
    address:
      name: Adresse
      selector:
        text:

diagnose:
  name: Diagnostic de liaison
  description: >-
    Se connecte SANS imprimer et renvoie le débit mesuré, le canal d'écriture retenu et
    les crédits de contrôle de flux. C'est le test à lancer en premier depuis un proxy BLE.
  fields:
    address:
      name: Adresse
      selector:
        text:

print_raw:
  name: Impression d'un raster brut
  description: >-
    Imprime un raster brut tel quel (72 octets par ligne, 1 = noir, bit de poids fort en
    premier), encodé en base64. Reproductible à l'octet près : sert à imprimer une image
    déjà préparée et validée.
  fields:
    data:
      name: Raster (base64)
      description: Payload binaire du raster, encodé en base64.
      required: true
      selector:
        text:
          multiline: true
    address:
      name: Adresse
      selector:
        text:
    dry_run:
      name: Simulation
      default: false
      selector:
        boolean:

print_image:
  name: Impression d'une image
  description: >-
    Imprime une image PNG/JPEG fournie en base64, redimensionnée à la largeur
    d'impression (576 points, proportions conservées). Par défaut, la photo est préparée
    (niveaux étalés + contours accentués) puis tramée : c'est le rendu retenu après
    comparaison sur papier. Une image déjà en noir et blanc franc (QR code, tracé) n'est
    jamais tramée, même si le tramage est demandé. Pour imprimer une photo en plus grand,
    l'imprimer tournée d'un quart de tour : elle profite alors de la longueur du rouleau.
  fields:
    image:
      name: Image (base64)
      description: Contenu du fichier image, encodé en base64.
      required: true
      selector:
        text:
          multiline: true
    enhance:
      name: Préparer la photo
      description: >-
        Étalement des niveaux puis accentuation des contours, appliqués avant la réduction à
        576 points. Recommandé (et par défaut) pour une photo ; mettre à false pour imprimer
        l'image telle quelle.
      default: true
      selector:
        boolean:
    dither:
      name: Tramage
      description: >-
        Tramage Floyd-Steinberg, recommandé pour les photos. Ignoré automatiquement sur une
        image déjà binaire (QR code, tracé), où il détruirait la lisibilité.
      default: true
      selector:
        boolean:
    invert:
      name: Inverser
      default: false
      selector:
        boolean:
    address:
      name: Adresse
      selector:
        text:
    dry_run:
      name: Simulation
      default: false
      selector:
        boolean:
